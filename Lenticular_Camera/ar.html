<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墙图识别</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#14291f;font-family:system-ui,sans-serif}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#overlay{position:absolute;left:0;top:0;transform-origin:0 0;object-fit:cover;background:#fff;display:none;pointer-events:none;will-change:transform}#hint{position:absolute;bottom:16px;left:16px;right:16px;color:#ecf3db;background:#14291fcc;padding:10px 12px;border-radius:7px;font-size:12px;line-height:1.6;pointer-events:none}#mark{position:absolute;inset:14%;border:1px solid #c6dd9566;border-radius:6px;pointer-events:none}</style>
<style>#overlay{opacity:0;will-change:transform,opacity;backface-visibility:hidden;mask-image:linear-gradient(to right,transparent,#000 .65%,#000 99.35%,transparent),linear-gradient(to bottom,transparent,#000 .65%,#000 99.35%,transparent);mask-composite:intersect;-webkit-mask-image:linear-gradient(to right,transparent,#000 .65%,#000 99.35%,transparent),linear-gradient(to bottom,transparent,#000 .65%,#000 99.35%,transparent);-webkit-mask-composite:source-in}#hint{transition:opacity .35s ease}</style>
</head><body><video id="video" autoplay muted playsinline></video><img id="overlay" alt="仰视时显示的第二张图片"><div id="mark"></div><div id="hint">正在准备图片识别…</div><script src="core.js"></script><script type="module" src="ar.js"></script></body></html>
